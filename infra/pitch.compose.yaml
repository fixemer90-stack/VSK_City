name: vsk-pitch
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vsk_pitch
      POSTGRES_USER: vsk_pitch
      POSTGRES_PASSWORD: ${PITCH_POSTGRES_PASSWORD:-synthetic-local-only}
    volumes: ['pitch-postgres:/var/lib/postgresql/data']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U vsk_pitch -d vsk_pitch']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: ['pitch-redis:/data']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    image: vsk-pitch-backend:local
    build:
      context: ..
      dockerfile: src/backend/Dockerfile
      target: runtime
    environment:
      DEMO_MODE: pitch
      DEMO_SEED_PATH: /app/seed
      POSTGRES_CONNECTION: 'Host=postgres;Database=vsk_pitch;Username=vsk_pitch;Password=${PITCH_POSTGRES_PASSWORD:-synthetic-local-only};Timeout=5;Command Timeout=30'
      REDIS_CONNECTION: redis:6379,abortConnect=false,connectTimeout=3000,syncTimeout=3000
      DEMOLITION_POLL_SECONDS: ${PITCH_DEMOLITION_POLL_SECONDS:-10}
      ASPNETCORE_URLS: http://+:8080
    ports: ['127.0.0.1:5189:8080']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, dotnet, Vsk.Pitch.dll, --health-check]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
  frontend:
    image: vsk-pitch-frontend:local
    build:
      context: ..
      dockerfile: src/frontend/Dockerfile
    ports: ['127.0.0.1:5188:80']
    depends_on:
      backend: {condition: service_healthy}
volumes:
  pitch-postgres:
    name: vsk-pitch-postgres-data
  pitch-redis:
    name: vsk-pitch-redis-data
